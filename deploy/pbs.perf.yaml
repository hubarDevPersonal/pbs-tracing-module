external_url: "http://localhost:8080"
host: ""
port: 8080
status_response: "I'm OK"

compression:
  request:
    enable_gzip: true
  response:
    enable_gzip: true

auction_timeouts_ms:
  default: 1000
  max: 3000

debug:
  timeout_notification:
    log: false
    sampling_rate: 0
    fail_only: true

privacy:
  ccpa:
    enabled: false

gdpr:
  enabled: false
  default_value: "0"
  timeouts_ms:
    init_vendorlist_fetches: 30000
    active_vendorlist_fetch: 10000

account_required: false

account_defaults:
  debug_allow: true
  events:
    enabled: true

hooks:
  enabled: true
  modules:
    test_provider:
      test_tracer:
        enabled: true

  host_execution_plan:
    endpoints:
      /openrtb2/auction:
        stages:
          entrypoint:
            groups:
              timeout: 50
              hook_sequence:
                - module_code: test_provider.test_tracer
                  hook_impl_code: test_provider_test_tracer

          processed_auction_request:
            groups:
              timeout: 50
              hook_sequence:
                - module_code: test_provider.test_tracer
                  hook_impl_code: test_provider_test_tracer

          bidder_request:
            groups:
              timeout: 50
              hook_sequence:
                - module_code: test_provider.test_tracer
                  hook_impl_code: test_provider_test_tracer

          raw_bidder_response:
            groups:
              timeout: 50
              hook_sequence:
                - module_code: test_provider.test_tracer
                  hook_impl_code: test_provider_test_tracer

          all_processed_bid_responses:
            groups:
              timeout: 50
              hook_sequence:
                - module_code: test_provider.test_tracer
                  hook_impl_code: test_provider_test_tracer

          auction_response:
            groups:
              timeout: 50
              hook_sequence:
                - module_code: test_provider.test_tracer
                  hook_impl_code: test_provider_test_tracer

          exitpoint:
            groups:
              timeout: 50
              hook_sequence:
                - module_code: test_provider.test_tracer
                  hook_impl_code: test_provider_test_tracer

# ---------------------------------------------------------------------------------------------
# Performance overlay (docs/06-performance.md). Everything above is the assessment's configuration
# with production-like timeouts; everything below is additive.
# ---------------------------------------------------------------------------------------------

# Outbound HTTP client used for bidder calls (router.go → http.Transport). Defaults in brackets.
http_client:
  max_connections_per_host: 0           # [0] unlimited; cap only if a bidder must be protected
  max_idle_connections: 1024            # [400]  pool across all bidders
  max_idle_connections_per_host: 64     # [10]   keep-alive per bidder host: fewer new dials → fewer DNS lookups and TLS handshakes
  idle_connection_timeout_seconds: 90   # [60]   keep pooled connections through short traffic gaps
  tls_handshake_timeout_seconds: 5      # [10]
  expect_continue_timeout_seconds: 1    # [1]
  dialer:
    timeout_seconds: 5                  # [30]   a bidder that cannot be dialed in 5 s is down
    keep_alive_seconds: 30              # [15]   TCP keep-alive probes
  throttle:                             # adaptive bidder throttling based on transport queue wait
    enable_throttling: true
    simulate_throttling_only: true      # observe first: logs "would throttle" without dropping bidders
    long_queue_wait_threshold_ms: 50
    short_queue_wait_threshold_ms: 10
    throttle_window: 1000

# Soft heap target for the Go GC (bytes). Reduces GC frequency under steady load at the cost of RSS.
garbage_collector_threshold: 134217728  # 128 MiB

# Metrics + profiling. pprof is served on admin_port (default 6060) whenever admin.enabled is true.
admin:
  enabled: true
metrics:
  prometheus:
    port: 9100
    namespace: prebid
    subsystem: server
    timeout_ms: 10000
  disabled_metrics:
    adapter_connections_metrics: false       # [true] adapter_connection_created / _reused per bidder — pool health
    adapter_connections_dial_metrics: false  # [true] connection wait / DNS lookup / TLS handshake durations per bidder

# Stored Request Configuration
stored_requests:
  enabled: true
  filesystem:
    enabled: true

stored_amp_req:
  enabled: true

stored_responses:
  enabled: true

  in_memory_cache:
    type: none

adapters:
  appnexus:
    platform_id: "platform_id"
    debug:
      allow: true
  colossus:
    debug:
      allow: true
 