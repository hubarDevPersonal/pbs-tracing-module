name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: go vet
        run: go vet ./...
      - name: Unit + integration tests (race)
        run: go test ./... -race -count=1
      - name: Race suite x3
        run: go test ./internal/testtracer -race -run '^TestRace' -count=3
      - name: Coverage (module package)
        run: |
          go test ./internal/testtracer -count=1 -coverprofile=cover.out
          go tool cover -func=cover.out | tail -1

  review:
    name: Review (vuln scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: govulncheck
        # Advisory gate: surfaces known CVEs in dependencies (mostly upstream PBS) without hard-blocking merges.
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  docker:
    name: Docker image (PBS + module)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (module tests run in the build stage)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: pbs-tracer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: "Smoke: container starts and serves /status"
        run: |
          docker run -d --name pbs -p 8080:8080 pbs-tracer:ci
          for i in $(seq 1 60); do curl -sf http://localhost:8080/status && break; sleep 1; done
          curl -sf http://localhost:8080/status
          docker rm -f pbs
